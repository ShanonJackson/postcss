[package]
name = "postcss"
version = "8.4.31"
edition = "2021"
description = "Pure Rust port of the PostCSS 8.4.31 processor"
license = "MIT"
repository = "https://github.com/postcss/postcss"
readme = "../../README.md"
authors = ["PostCSS Contributors"]
publish = false

[dependencies]
base64 = "0.21"
pathdiff = "0.2"
percent-encoding = "2.3"
once_cell = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sourcemap = "9.0"
url = "2.4"
regex = "1.10"
